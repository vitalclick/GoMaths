name: Deploy to VPS

# SSH into the VPS and run a rolling update:
#   git pull → docker compose build → docker compose up -d
#
# Triggers:
#   - push to main (backend/services/curriculum paths only)
#   - workflow_dispatch: manual trigger from the Actions tab
#
# Required secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST         — IP address of the VPS (e.g. 216.158.233.47)
#   VPS_SSH_KEY      — private ed25519 key for the deploy user
#   VPS_KNOWN_HOSTS  — output of `ssh-keyscan <ip>` (prevents MITM)
#
# Optional repo variables (Settings → Secrets and variables → Variables):
#   VPS_USER     — SSH username (default: gomaths)
#   VPS_PORT     — SSH port (default: 22)
#   VPS_APP_DIR  — app directory on the VPS (default: ~/GoMaths)
#   VPS_API_URL  — used only for the post-deploy health check
#
# If VPS_HOST or VPS_SSH_KEY is missing the job skips rather than fails,
# matching the convention of deploy-fly.yml.

on:
  push:
    branches: [main]
    paths:
      - "services/backend-api/**"
      - "services/ai-services/**"
      - "curriculum-data/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch:

concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy stack to VPS
    runs-on: ubuntu-latest
    if: ${{ secrets.VPS_HOST != '' && secrets.VPS_SSH_KEY != '' }}
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ vars.VPS_USER || 'gomaths' }}
          PORT: ${{ vars.VPS_PORT || '22' }}
          APP_DIR: ${{ vars.VPS_APP_DIR || '~/GoMaths' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$USER@$HOST" bash << 'ENDSSH'
            set -euo pipefail
            cd ~/GoMaths

            echo "==> git pull"
            git fetch origin main
            git checkout main
            git pull origin main

            echo "==> docker compose build + up"
            docker compose -f docker-compose.prod.yml --env-file .env.production \
              up -d --build --remove-orphans

            echo "==> seed curriculum"
            docker exec gomaths-backend-1 sh -c \
              "cd /app && node_modules/.bin/ts-node prisma/seed.ts"

            echo "==> done"
          ENDSSH

      - name: Health check
        env:
          API_URL: ${{ secrets.VPS_API_URL || vars.VPS_API_URL || format('https://{0}', secrets.VPS_HOST) }}
        run: |
          sleep 10
          curl -sf "$API_URL/api/health" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok', d"
          echo "Health check passed"
